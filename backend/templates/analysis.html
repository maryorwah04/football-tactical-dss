{% extends 'base.html' %}{% block title %}Tactical analysis · Touchline Ledger{% endblock %}{% block content %}<div class="container-narrow"><div class="eyebrow">Rule-based analysis</div><h1 class="page-title mb-2">Tactical analysis</h1><p class="text-secondary mb-4">Enter the match notes. The same inputs always produce the same recommendation.</p><div class="card p-4 col-lg-8"><form method="post">{% csrf_token %}<label>Opponent<select required name="opponent_id" class="form-select">{% for opponent in opponents %}<option value="{{ opponent.id }}">{{ opponent.name }} · {{ opponent.formation }} · {{ opponent.style }}</option>{% empty %}<option>Add an opponent profile first</option>{% endfor %}</select></label><div class="row"><div class="col-md-4"><label>Attacking strength<select name="attacking_strength" class="form-select"><option>Low</option><option selected>Medium</option><option>High</option></select></label></div><div class="col-md-4"><label>Midfield strength<select name="midfield_strength" class="form-select"><option>Low</option><option selected>Medium</option><option>High</option></select></label></div><div class="col-md-4"><label>Defensive strength<select name="defensive_strength" class="form-select"><option>Low</option><option selected>Medium</option><option>High</option></select></label></div></div><label>Our playing style<select name="team_style" class="form-select"><option>{{ team.style }}</option><option>Fast transitions</option><option>Direct and physical</option><option>Flexible / balanced</option></select></label><button class="btn btn-orange mt-3">Generate recommendation</button></form></div></div>{% endblock %}
